<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Evolue Consórcios</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --accent: #d4af37;
      --accent-dark: #b68b2a;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      background: #0d0d0d;
      padding: 16px 0;
      text-align: center;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    header img {
      width: 180px;
      animation: fadeInDown 1s ease;
    }

    @keyframes fadeInDown {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    h1 {
      color: var(--accent);
      text-align: center;
      margin-top: 20px;
      font-size: 1.8rem;
    }

    .container {
      max-width: 600px;
      width: 90%;
      background: #111;
      border-radius: 12px;
      padding: 24px;
      margin-top: 20px;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
      animation: fadeInUp 1s ease;
    }

    @keyframes fadeInUp {
      from {opacity: 0; transform: translateY(10px);}
      to {opacity: 1; transform: translateY(0);}
    }

    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
    }

    .tab {
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      transition: 0.3s;
    }

    .tab.active {
      background: var(--accent);
      color: #000;
      font-weight: 600;
    }

    input[type=range] {
      width: 100%;
      margin: 10px 0;
      accent-color: var(--accent);
    }

    select, button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 16px;
    }

    select {
      background: #222;
      color: #fff;
    }

    button {
      background: var(--accent);
      color: #000;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: var(--accent-dark);
    }

    .result {
      text-align: center;
      margin-top: 20px;
      font-size: 20px;
      color: var(--accent);
    }

    footer {
      margin-top: 40px;
      font-size: 13px;
      color: #aaa;
      text-align: center;
      padding-bottom: 60px;
    }

    .floating-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--accent);
      color: #000;
      padding: 14px 18px;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
      font-size: 22px;
      text-decoration: none;
      transition: 0.3s;
    }

    .floating-btn:hover {
      background: var(--accent-dark);
    }

    .portfolio {
      max-width: 600px;
      width: 90%;
      margin-top: 40px;
      text-align: center;
    }

    .portfolio-box {
      background: #111;
      height: 200px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      font-size: 16px;
    }

  </style>
</head>
