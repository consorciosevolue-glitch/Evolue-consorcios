<style>
:root { --bg:#000; --text:#fff; --accent:#d4af37; --accent-dark:#b68b2a; }
* { box-sizing:border-box; font-family:'Inter', system-ui, sans-serif; }
body { margin:0; background:var(--bg); color:var(--text); padding:0; display:flex; flex-direction:column; align-items:center; }

header { width:100%; background:#0d0d0d; padding:16px 0; text-align:center; box-shadow:0 0 10px rgba(212,175,55,0.2); }
header img { width:180px; animation: fadeInDown 1s ease; }
@keyframes fadeInDown { from{opacity:0; transform:translateY(-10px);} to{opacity:1; transform:translateY(0);} }

h1 { color:var(--accent); text-align:center; margin-top:20px; font-size:1.8rem; }
.container { max-width:600px; width:90%; background:#111; border-radius:12px; padding:24px; margin-top:20px; box-shadow:0 0 25px rgba(212,175,55,0.15); animation:fadeInUp 1s ease; }
@keyframes fadeInUp { from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }

.tabs { display:flex; justify-content:space-around; margin-bottom:20px; }
.tab { padding:10px 20px; border-radius:8px; cursor:pointer; background:#222; transition:0.3s; }
.tab.active { background:var(--accent); color:#000; font-weight:600; }

input[type=range] { width:100%; margin:10px 0; accent-color:var(--accent); }
select, button { width:100%; padding:10px; border:none; border-radius:8px; margin:8px 0; font-size:16px; }
select { background:#222; color:#fff; }
button { background:var(--accent); color:#000; font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { background-color:var(--accent-dark); }

.result { text-align:center; margin-top:20px; font-size:20px; color:var(--accent); }
footer { margin-top:40px; font-size:13px; color:#aaa; text-align:center; padding-bottom:60px; }

.floating-btn { position:fixed; bottom:20px; right:20px; background:var(--accent); color:#000; padding:14px 18px; border-radius:50%; box-shadow:0 0 15px rgba(212,175,55,0.4); font-size:22px; text-decoration:none; transition:0.3s; }
.floating-btn:hover { background-color:var(--accent-dark); }

.portfolio { max-width:600px; width:90%; margin-top:40px; text-align:center; }
.portfolio-box { background:#111; margin:15px 0; border-radius:12px; box-shadow:0 0 15px rgba(212,175,55,0.15); display:flex; justify-content:center; align-items:center; color:#555; font-size:16px; padding:10px; }

.highlight-title, .top-title-gradient {
  font-size: 2rem;
  font-weight: 700;
  text-align: center;
  background: linear-gradient(90deg, #d4af37, #fff, #d4af37);
  background-size: 200% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 3s linear infinite;
  margin-top: 20px;
}

.top-title-gradient { font-size: 2.5rem; }

@keyframes shine {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* CARROSSEL AJUSTADO PARA FORMATO 1:1 */
#carousel-box { position: relative; width:100%; padding-top:100%; overflow:hidden; border-radius:12px; }
.carousel-container { position:absolute; top:0; left:0; width:100%; height:100%; overflow:hidden; }
.carousel-track { display:flex; height:100%; cursor:grab; transition:transform 0.3s ease; }
.carousel-track.grabbing { cursor:grabbing; }
.carousel-slide { min-width:100%; height:100%; object-fit:cover; user-select:none; border-radius:12px; }
.carousel-indicators { display:flex; justify-content:center; align-items:center; margin-top:15px; gap:8px; position:relative; }
.carousel-indicators span { display:block; width:10px; height:10px; background:rgba(212,175,55,0.3); border-radius:50%; transition:0.3s; cursor:pointer; }
.carousel-indicators span.active { background:var(--accent); }

/* VIDEOS */

@media (max-width:768px){ .video-item{ width:90%; } }

function atualizarParcelas(){ 
  parcelasSelect.innerHTML=''; 
  const valores=tabela[parseInt(valorRange.value)]; 
  for(const p in valores){ 
    const opt=document.createElement('option'); 
    opt.value=p; 
    opt.textContent=p+'x'; 
    parcelasSelect.appendChild(opt); 
  } 
}
function atualizarValor(){ 
  valorDisplay.textContent=parseInt(valorRange.value).toLocaleString('pt-BR'); 
  const valor=parseInt(valorRange.value); 
  const parcelas=parcelasSelect.value; 
  const valParc=tabela[valor]?.[parcelas]||0; 
  parcelaValor.textContent='R$ '+valParc.toLocaleString('pt-BR',{minimumFractionDigits:2}); 
}

const carouselTrack = document.getElementById('carousel-track');
const carouselIndicators = document.getElementById('carousel-indicators');
const carouselImages = ['1.jpg','2.jpg','3.jpg','4.jpg','5.jpg','6.jpg'];
let index = 1;
let startX = 0, currentX = 0, dragging = false;

function setupCarousel(){
  carouselTrack.innerHTML = '';
  carouselIndicators.innerHTML = '';

  const lastClone = document.createElement('img');
  lastClone.src = carouselImages[carouselImages.length - 1];
  lastClone.className = 'carousel-slide';
  carouselTrack.appendChild(lastClone);

  carouselImages.forEach((src, i) => {
    const slide = document.createElement('img');
    slide.src = src;
    slide.className = 'carousel-slide';
    carouselTrack.appendChild(slide);

    const dot = document.createElement('span');
    dot.addEventListener('click', () => gotoSlide(i + 1));
    carouselIndicators.appendChild(dot);
  });

  const firstClone = document.createElement('img');
  firstClone.src = carouselImages[0];
  firstClone.className = 'carousel-slide';
  carouselTrack.appendChild(firstClone);

  carouselTrack.style.transform = `translateX(-${index * 100}%)`;
  updateIndicators();
}

function updateIndicators(){
  const dots = carouselIndicators.children;
  let visibleIndex = index - 1;
  if(index === 0) visibleIndex = carouselImages.length - 1;
  if(index === carouselImages.length + 1) visibleIndex = 0;
  Array.from(dots).forEach((dot,i)=>dot.classList.toggle('active', i === visibleIndex));
}

function gotoSlide(i){ index=i; carouselTrack.style.transition='transform 0.3s ease'; carouselTrack.style.transform=`translateX(-${index*100}%)`; updateIndicators(); }

function startDrag(x){ dragging=true; startX=x; carouselTrack.classList.add('grabbing'); carouselTrack.style.transition='none'; }
function moveDrag(x){ if(!dragging) return; currentX=x-startX; carouselTrack.style.transform=`translateX(-${index*100 - (currentX/carouselTrack.clientWidth)*100}%)`; }
function endDrag(){ if(!dragging) return; dragging=false; carouselTrack.classList.remove('grabbing'); if(currentX < -carouselTrack.clientWidth/4) index++; else if(currentX > carouselTrack.clientWidth/4) index--; currentX=0; carouselTrack.style.transition='transform 0.3s ease'; carouselTrack.style.transform=`translateX(-${index*100}%)`; }

document.addEventListener('mousemove', e=>moveDrag(e.clientX));
document.addEventListener('mouseup', endDrag);
document.addEventListener('touchmove', e=>{ moveDrag(e.touches[0].clientX); e.preventDefault(); });
document.addEventListener('touchend', endDrag);

carouselTrack.addEventListener('mousedown', e=>startDrag(e.clientX));
carouselTrack.addEventListener('touchstart', e=>startDrag(e.touches[0].clientX));

carouselTrack.addEventListener('transitionend', ()=>{
  if(index===0){ index=carouselImages.length; carouselTrack.style.transition='none'; carouselTrack.style.transform=`translateX(-${index*100}%)`; }
  if(index===carouselImages.length+1){ index=1; carouselTrack.style.transition='none'; carouselTrack.style.transform=`translateX(-${index*100}%)`; }
  updateIndicators();
});

window.addEventListener('resize', ()=>carouselTrack.style.transform=`translateX(-${index*100}%)`);
setupCarousel();
